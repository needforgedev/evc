name: evc_maps
description: "EVC maps + location abstraction over the chosen provider (Google Maps now, MapLibre/OSM later)."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

# Part of the EVC pub workspace (see repo-root pubspec.yaml).
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  evc_core:
    path: ../core
  evc_ui_kit:
    path: ../ui_kit
  # Real map + location providers. App code never imports these directly — it
  # goes through EvcGoogleMap / EvcLocation so the provider can be swapped later.
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
